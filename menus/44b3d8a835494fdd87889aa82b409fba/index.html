<title>Menù · Menu</title><style>:root {
  --color-page: #f6f7f1;
  --color-ink: #17211d;
  --color-muted: #65706a;
  --color-surface: #ffffff;
  --color-surface-2: #edf4ef;
  --color-surface-3: #fff8ec;
  --color-line: #cbd8cf;
  --color-accent: #0f766e;
  --color-accent-2: #c84c35;
  --color-accent-3: #d9a441;
  --color-alert: #9f2d24;
  --shadow-soft: 0 18px 52px rgba(20, 34, 29, .12);
  --radius-card: 8px;
  --radius-control: 8px;
  --space-page: clamp(16px, 4vw, 48px);
  color-scheme: light;
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-width: 0;
  margin: 0;
  overflow-x: clip;
  background: var(--color-page);
  color: var(--color-ink);
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-shell {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: var(--space-page);
}

.menu-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 24px;
  align-items: end;
  padding: 32px 0 26px;
  border-bottom: 2px solid rgba(15, 118, 110, .18);
}

.venue-kicker {
  margin: 0 0 8px;
  color: var(--color-accent);
  font-size: .82rem;
  font-weight: 700;
  text-transform: uppercase;
}

.venue-name {
  margin: 0;
  max-width: 760px;
  overflow-wrap: anywhere;
  font-size: 5.35rem;
  line-height: .92;
  font-weight: 800;
}

.venue-tagline {
  max-width: 660px;
  margin: 18px 0 0;
  color: var(--color-muted);
  font-size: 1.02rem;
  line-height: 1.55;
}

.language-field {
  display: grid;
  gap: 8px;
  min-width: 180px;
  padding: 12px;
  border: 1px solid rgba(15, 118, 110, .18);
  border-radius: var(--radius-card);
  background: rgba(255, 255, 255, .72);
}

.language-field label {
  color: var(--color-muted);
  font-size: .82rem;
  font-weight: 700;
}

.language-field select,
.search-box input {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-control);
  background: var(--color-surface);
  color: var(--color-ink);
  padding: 0 12px;
}

.language-field select {
  font-weight: 800;
}

.search-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 46px;
  gap: 8px;
  align-items: center;
}

.search-submit {
  display: inline-grid;
  place-items: center;
  width: 46px;
  min-height: 44px;
  border: 1px solid var(--color-accent);
  border-radius: var(--radius-control);
  background: var(--color-accent);
  color: #ffffff;
  box-shadow: 0 8px 20px rgba(15, 118, 110, .18);
}

.search-submit:hover {
  background: #0b665f;
}

.search-icon {
  width: 19px;
  height: 19px;
  color: currentColor;
}

.controls {
  display: grid;
  grid-template-columns: minmax(220px, .9fr) minmax(0, 1.1fr) minmax(0, 1.2fr) auto;
  gap: 18px;
  align-items: start;
  margin: 22px 0 30px;
  padding: 18px;
  border: 1px solid rgba(15, 118, 110, .16);
  border-radius: var(--radius-card);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, .96), rgba(237, 244, 239, .78)),
    var(--color-surface);
  box-shadow: 0 18px 44px rgba(20, 34, 29, .08);
}

.control-group {
  min-width: 0;
}

.control-title {
  margin: 0 0 10px;
  color: var(--color-muted);
  font-size: .82rem;
  font-weight: 800;
  text-transform: uppercase;
}

.filter-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 38px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-control);
  background: linear-gradient(180deg, #ffffff, var(--color-surface-3));
  color: var(--color-ink);
  padding: 8px 12px 8px 10px;
  font-size: .9rem;
  font-weight: 750;
  line-height: 1.1;
  box-shadow: 0 8px 20px rgba(20, 34, 29, .06);
  transition: border-color .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease;
}

.chip-icon {
  width: 17px;
  height: 17px;
  flex: 0 0 17px;
  color: var(--color-accent);
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.search-submit .search-icon {
  color: #ffffff;
}

.filter-chip:hover {
  border-color: rgba(15, 118, 110, .45);
  box-shadow: 0 10px 22px rgba(20, 34, 29, .1);
}

.filter-chip[aria-pressed="true"] {
  border-color: var(--color-accent);
  background: var(--color-accent);
  color: #ffffff;
  box-shadow: inset 0 0 0 1px var(--color-accent);
}

.filter-chip[aria-pressed="true"] .chip-icon {
  color: #ffffff;
}

.reset-button {
  min-height: 44px;
  align-self: end;
  border: 1px solid var(--color-accent);
  border-radius: var(--radius-control);
  background: var(--color-accent);
  color: #ffffff;
  padding: 0 16px;
  font-weight: 800;
}

.menu-grid {
  display: grid;
  gap: 34px;
}

.section {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 26px;
  padding: 22px 0 8px;
}

.section-heading {
  position: sticky;
  top: 16px;
  align-self: start;
}

.section-title {
  margin: 0;
  font-size: 1.28rem;
  line-height: 1.12;
}

.section-description {
  margin: 10px 0 0;
  color: var(--color-muted);
  line-height: 1.45;
}

.items {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.menu-card {
  min-width: 0;
  scroll-margin-top: 28px;
  overflow: hidden;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-card);
  background: var(--color-surface);
  box-shadow: var(--shadow-soft);
}

.menu-card.featured {
  border-color: rgba(15, 118, 110, .5);
}

.menu-card.pairing-target {
  border-color: var(--color-accent-3);
  box-shadow:
    0 0 0 4px rgba(217, 164, 65, .26),
    var(--shadow-soft);
}

.item-image {
  width: 100%;
  aspect-ratio: 40 / 9;
  object-fit: cover;
  display: block;
  background: var(--color-surface-2);
}

.unknown-allergens, .food-alert { margin: 0; color: var(--color-muted); font-size: .82rem; line-height: 1.5; }
.safety-note { color: var(--color-muted); font-size: .88rem; line-height: 1.6; max-width: 85ch; }
body[data-theme="cocktail"] { --color-page: #171c20; --color-surface: #222a30; --color-ink: #f4ede2; --color-muted: #c8c6be; --color-accent: #f2ca7b; --color-line: #596266; --color-surface-2: #363e3e; --color-surface-3: #333738; }
body[data-theme="cocktail"] .controls, body[data-theme="cocktail"] .language-field { background: var(--color-surface); }
body[data-theme="cocktail"] .filter-chip { background: var(--color-surface-2); }
body[data-theme="cocktail"] .filter-chip[aria-pressed="true"], body[data-theme="cocktail"] .reset-button, body[data-theme="cocktail"] .search-submit { background: var(--color-accent); color: #171c20; }
body[data-theme="cocktail"] .search-icon, body[data-theme="cocktail"] .filter-chip[aria-pressed="true"] .chip-icon { color: #171c20; }
body[data-theme="bakery"] { --color-page: #fff7f0; --color-accent: #9b3e48; --color-surface-2: #f8e9e6; }
body[data-theme="cafe"] { --color-page: #faf5eb; --color-accent: #765035; --color-surface-2: #eee6d9; }
body[data-theme="fine-dining"] { --color-page: #faf9f5; --color-accent: #435343; --shadow-soft: none; --radius-card: 2px; }
body[data-theme="fine-dining"] .venue-name, body[data-theme="fine-dining"] .section-title { font-family: Georgia, serif; font-weight: 400; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

.item-body {
  display: grid;
  gap: 12px;
  padding: 16px;
}

.item-topline {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 14px;
  align-items: start;
}

.item-name {
  margin: 0;
  overflow-wrap: anywhere;
  font-size: 1.1rem;
  line-height: 1.18;
}

.item-price {
  color: var(--color-accent);
  font-size: 1rem;
  font-weight: 900;
  white-space: nowrap;
}

.item-description {
  margin: 0;
  color: var(--color-muted);
  line-height: 1.45;
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.badge {
  border-radius: 999px;
  padding: 5px 8px;
  background: var(--color-surface-2);
  color: var(--color-ink);
  font-size: .76rem;
  font-weight: 700;
  line-height: 1;
}

.badge.alert {
  background: #fff0ec;
  color: var(--color-alert);
}

.badge.may {
  background: #fff8dc;
  color: #76540e;
}

.pairings {
  border-top: 1px solid var(--color-line);
  padding-top: 11px;
  color: var(--color-muted);
  font-size: .88rem;
  line-height: 1.35;
}

.pairings strong {
  color: var(--color-ink);
}

.pairing-link {
  color: var(--color-accent);
  font-weight: 800;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}

.pairing-link:hover {
  color: var(--color-accent-2);
}

.empty-state {
  border: 1px dashed var(--color-line);
  border-radius: var(--radius-card);
  padding: 28px;
  color: var(--color-muted);
  background: var(--color-surface);
}

:focus-visible {
  outline: 3px solid rgba(15, 118, 110, .38);
  outline-offset: 3px;
}

@media (max-width: 940px) {
  .venue-name {
    font-size: 4.15rem;
  }

  .menu-header,
  .controls,
  .section {
    grid-template-columns: 1fr;
  }

  .section-heading {
    position: static;
  }

  .items {
    grid-template-columns: 1fr;
  }

  .reset-button {
    justify-self: start;
  }
}

@media (max-width: 520px) {
  .app-shell {
    padding: 14px;
  }

  .venue-name {
    font-size: 2.85rem;
  }

  .filter-chip {
    flex: 1 1 calc(50% - 8px);
  }

  .item-topline {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .item-price {
    white-space: normal;
  }
}
</style></head>

window.MOOD_MENU_LABELS={"unknownAllergens": {"it": "Allergeni: informazioni incomplete o non disponibili.", "en": "Allergens: information incomplete or unavailable.", "fr": "Allergènes : informations incomplètes ou indisponibles.", "de": "Allergene: Angaben unvollständig oder nicht verfügbar.", "es": "Alérgenos: información incompleta o no disponible."}, "suggestedPairings": {"it": "Abbinamenti suggeriti", "en": "Suggested pairings", "fr": "Accords suggérés", "de": "Empfohlene Kombinationen", "es": "Maridajes sugeridos"}, "safetyNote": {"it": "Le indicazioni alimentari riportano quanto dichiarato nel menù originale. Con un filtro allergeni attivo, i prodotti con informazioni incomplete vengono nascosti. Per esigenze alimentari rivolgiti al personale. Gli abbinamenti sono suggerimenti automatici; le illustrazioni sono segnaposto.", "en": "Dietary information reflects declarations in the original menu. Allergen filters also hide items with incomplete information. Ask staff about dietary needs. Pairings are automatic suggestions; illustrations are placeholders.", "fr": "Les informations alimentaires reprennent les déclarations du menu original. Les filtres d’allergènes masquent aussi les produits aux informations incomplètes. Adressez-vous au personnel pour vos besoins alimentaires. Les accords sont des suggestions automatiques ; les illustrations sont indicatives.", "de": "Die Lebensmittelangaben stammen aus der Originalspeisekarte. Allergenfilter blenden auch Produkte mit unvollständigen Angaben aus. Fragen Sie das Personal nach Ihren Ernährungsbedürfnissen. Kombinationen werden automatisch vorgeschlagen; die Abbildungen sind Platzhalter.", "es": "La información alimentaria reproduce las declaraciones del menú original. Los filtros de alérgenos también ocultan los productos con información incompleta. Consulta al personal sobre tus necesidades alimentarias. Los maridajes son sugerencias automáticas; las ilustraciones son orientativas."}, "title": {"it": "Menu", "en": "Menu", "fr": "Menu", "de": "Menue", "es": "Menu"}, "language": {"it": "Lingua", "en": "Language", "fr": "Langue", "de": "Sprache", "es": "Idioma"}, "search": {"it": "Cerca nel menu", "en": "Search menu", "fr": "Rechercher", "de": "Suchen", "es": "Buscar"}, "preferences": {"it": "Preferenze", "en": "Preferences", "fr": "Preferences", "de": "Vorlieben", "es": "Preferencias"}, "allergies": {"it": "Nascondi allergeni", "en": "Hide allergens", "fr": "Masquer allergenes", "de": "Allergene ausblenden", "es": "Ocultar alergenos"}, "pairings": {"it": "Abbinamenti", "en": "Pairings", "fr": "Accords", "de": "Empfehlungen", "es": "Maridajes"}, "alerts": {"it": "Alert alimentari", "en": "Food alerts", "fr": "Alertes alimentaires", "de": "Lebensmittelhinweise", "es": "Alertas alimentarias"}, "noResults": {"it": "Nessun elemento corrisponde ai filtri selezionati.", "en": "No items match the selected filters.", "fr": "Aucun element ne correspond aux filtres.", "de": "Keine Elemente entsprechen den Filtern.", "es": "No hay elementos para los filtros seleccionados."}, "reset": {"it": "Reset", "en": "Reset", "fr": "Reinitialiser", "de": "Zuruecksetzen", "es": "Restablecer"}, "mayContain": {"it": "Puo contenere", "en": "May contain", "fr": "Peut contenir", "de": "Kann enthalten", "es": "Puede contener"}};</script>
<script>(function () {
  const requiredLanguages = ["it", "en", "fr", "de", "es"];
  const languageNames = {
    it: "🇮🇹 Italiano",
    en: "🇬🇧 English",
    fr: "🇫🇷 Français",
    de: "🇩🇪 Deutsch",
    es: "🇪🇸 Español"
  };

  const dietaryIcons = {
    vegan: "leaf",
    vegetarian: "sprout",
    gluten_free: "wheat-off",
    lactose_free: "milk-off",
    alcohol_free: "glass-off",
    spicy: "flame"
  };

  const allergenIcons = {
    gluten: "wheat",
    crustaceans: "shell",
    eggs: "egg",
    fish: "fish",
    peanuts: "peanut",
    soy: "bean",
    milk: "milk",
    nuts: "nut",
    celery: "leaf",
    mustard: "seed",
    sesame: "seed",
    sulfites: "wine",
    lupin: "flower",
    molluscs: "shell"
  };

  const state = {
    lang: savedLanguage(),
    searchDraft: "",
    search: "",
    dietary: new Set(),
    allergens: new Set(),
    focusItemId: null
  };

  function savedLanguage() {
    try { return localStorage.getItem("mfm-lang") || "it"; }
    catch (_) { return "it"; }
  }

  function text(value, lang = state.lang) {
    if (!value) return "";
    return value[lang] || value.it || "";
  }

  function money(value, currency) {
    return /[€$£¥]|\b[A-Z]{3}\b/.test(value) ? value : `${value} ${currency}`;
  }

  function imageUrl(src) {
    if (!src) return "";
    if (src.startsWith("data:image/")) return src;
    const path = window.location.pathname.replace(/\\/g, "/");
    if (path.includes("/src/") || path.includes("/dist/") || path.endsWith("/src/index.html") || path.endsWith("/dist/index.html")) {
      return `../${src}`;
    }
    return src;
  }

  async function loadJson(path) {
    const response = await fetch(path);
    if (!response.ok) throw new Error(`Cannot load ${path}`);
    return response.json();
  }

  async function loadData() {
    if (window.MOOD_MENU_DATA && window.MOOD_MENU_TAXONOMIES && window.MOOD_MENU_LABELS) {
      return {
        menu: window.MOOD_MENU_DATA,
        taxonomies: window.MOOD_MENU_TAXONOMIES,
        labels: window.MOOD_MENU_LABELS
      };
    }

    const [menu, taxonomies, labels] = await Promise.all([
      loadJson("../data/sample-menu.json"),
      loadJson("../data/taxonomies.json"),
      loadJson("../data/ui-labels.json")
    ]);
    return { menu, taxonomies, labels };
  }

  function itemMatches(item) {
    const haystack = [
      text(item.name),
      text(item.description),
      item.price
    ].join(" ").toLowerCase();

    if (state.search && !haystack.includes(state.search.toLowerCase())) {
      return false;
    }

    for (const tag of state.dietary) {
      if (!item.dietary.includes(tag)) return false;
    }

    const blockedAllergens = new Set([...(item.allergens || []), ...(item.may_contain || [])]);
    if (state.allergens.size && item.allergen_status !== "declared") return false;
    for (const allergen of state.allergens) {
      if (blockedAllergens.has(allergen)) return false;
    }

    return true;
  }

  function iconSvg(name) {
    const paths = {
      bean: '<path d="M7.7 14.7c-2.2-2.2-2.2-5.9 0-8.1 2.1-2.1 5.7-2.3 8.2-.5 2.9 2.2 3.4 6.5 1.1 9.4-2.2 2.7-6.6 2.8-9.3-.8Z"/><path d="M9.7 12.5c1.4.6 3.2.2 4.4-1.1 1-1 1.4-2.3 1.2-3.6"/>',
      egg: '<path d="M12 20c-4 0-7-2.8-7-6.8C5 9 8.7 4 12 4s7 5 7 9.2c0 4-3 6.8-7 6.8Z"/>',
      fish: '<path d="M3 12s3.2-5 8.4-5c4.5 0 7.6 5 7.6 5s-3.1 5-7.6 5C6.2 17 3 12 3 12Z"/><path d="M19 12l2.5-2.5v5L19 12Z"/><circle cx="9" cy="12" r=".8"/>',
      flame: '<path d="M12 21c-3.4 0-6-2.4-6-5.7 0-2.9 1.7-4.7 3.7-6.7.7-.7 1.2-1.9.9-3.6 2.8 1.3 5.8 4.4 4.8 8 .9-.4 1.7-1.1 2.2-2.2 1.5 4.8-.7 10.2-5.6 10.2Z"/>',
      flower: '<path d="M12 13.5c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4Z"/><path d="M12 13.5v6"/><path d="M12 17c-2.8-.1-5-1.3-6.5-3.5 3.1-.4 5.3.4 6.5 2.3"/><path d="M12 17c2.8-.1 5-1.3 6.5-3.5-3.1-.4-5.3.4-6.5 2.3"/>',
      "glass-off": '<path d="M4 4l16 16"/><path d="M8 4h8l-.8 5.8"/><path d="M10.5 12.6 12 14l2.2-2.2"/><path d="M12 14v6"/><path d="M9 20h6"/>',
      leaf: '<path d="M5 19c8.5 0 14-5.5 14-14-8.5 0-14 5.5-14 14Z"/><path d="M5 19 19 5"/>',
      milk: '<path d="M9 3h6"/><path d="M10 3v4l-2 2v10c0 1.1.9 2 2 2h4c1.1 0 2-.9 2-2V9l-2-2V3"/><path d="M8 13h8"/>',
      "milk-off": '<path d="M4 4l16 16"/><path d="M9 3h6"/><path d="M10 3v4l-1.3 1.3"/><path d="M8 13h5"/><path d="M16 16.8V9l-2-2V4.9"/><path d="M8 10.5V19c0 1.1.9 2 2 2h4c.5 0 1-.2 1.4-.5"/>',
      nut: '<path d="M12 21c-4.1 0-7-3.2-7-7.1C5 9.7 8.4 4 12 4s7 5.7 7 9.9c0 3.9-2.9 7.1-7 7.1Z"/><path d="M9.5 12c1.2.7 3.8.7 5 0"/>',
      peanut: '<path d="M9.5 21c-2.5 0-4.5-2-4.5-4.5 0-1.5.8-2.9 2-3.7-.8-.8-1.3-1.9-1.3-3.1C5.7 7.1 7.8 5 10.4 5c1.3 0 2.4.5 3.2 1.3.7-.8 1.8-1.3 3-1.3 2.4 0 4.4 2 4.4 4.4 0 1.6-.9 3-2.2 3.8.7.8 1.2 1.8 1.2 3 0 2.6-2.1 4.8-4.8 4.8-1.1 0-2.2-.4-3-1.1-.8.7-1.7 1.1-2.7 1.1Z"/>',
      seed: '<path d="M12 21c-3.2-2.4-5.5-5.4-5.5-9.1C6.5 8.2 9 5.2 12 3c3 2.2 5.5 5.2 5.5 8.9 0 3.7-2.3 6.7-5.5 9.1Z"/><path d="M12 8v8"/>',
      shell: '<path d="M4 17c1.6-6.2 4.2-10 8-12 3.8 2 6.4 5.8 8 12H4Z"/><path d="M4 17h16"/><path d="M8 17l4-12 4 12"/><path d="M12 5v12"/>',
      sprout: '<path d="M12 20V10"/><path d="M12 10c-3.4 0-6-2-7-5 3.8-.2 6.2 1.4 7 5Z"/><path d="M12 10c3.4 0 6-2 7-5-3.8-.2-6.2 1.4-7 5Z"/>',
      wheat: '<path d="M12 21V3"/><path d="M8 7l4 4"/><path d="M16 7l-4 4"/><path d="M8 12l4 4"/><path d="M16 12l-4 4"/><path d="M8 17l4 4"/><path d="M16 17l-4 4"/>',
      "wheat-off": '<path d="M4 4l16 16"/><path d="M12 21V9"/><path d="M12 6V3"/><path d="M8 7l4 4"/><path d="M16 7l-2.4 2.4"/><path d="M8 12l4 4"/><path d="M16 12l-2.4 2.4"/><path d="M8 17l4 4"/><path d="M16 17l-1.2 1.2"/>',
      wine: '<path d="M8 4h8l-1 8c-.2 1.7-1.5 3-3 3s-2.8-1.3-3-3L8 4Z"/><path d="M9 9h6"/><path d="M12 15v5"/><path d="M9 20h6"/>',
      search: '<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>'
    };
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.classList.add("chip-icon");
    svg.innerHTML = paths[name] || paths.leaf;
    return svg;
  }

  function createButton(label, iconName, pressed, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "filter-chip";
    button.append(iconSvg(iconName));
    const span = document.createElement("span");
    span.textContent = label;
    button.append(span);
    button.setAttribute("aria-pressed", String(pressed));
    button.addEventListener("click", onClick);
    return button;
  }

  function renderFilterGroup(title, entries, selectedSet, icons, onToggle) {
    const group = document.createElement("section");
    group.className = "control-group";

    const heading = document.createElement("h2");
    heading.className = "control-title";
    heading.textContent = title;
    group.append(heading);

    const list = document.createElement("div");
    list.className = "filter-list";

    for (const [id, value] of Object.entries(entries)) {
      list.append(createButton(text(value.label), icons[id], selectedSet.has(id), () => onToggle(id)));
    }

    group.append(list);
    return group;
  }

  function navigateToItem(itemId, data) {
    state.searchDraft = "";
    state.search = "";
    state.dietary.clear();
    state.allergens.clear();
    state.focusItemId = itemId;
    renderApp(data);
  }

  function renderCard(item, menu, taxonomies, labels, onPairingClick) {
    const card = document.createElement("article");
    card.className = `menu-card${item.featured ? " featured" : ""}`;
    card.id = `item-${item.id}`;
    card.tabIndex = -1;
    if (state.focusItemId === item.id) {
      card.classList.add("pairing-target");
    }

    const img = document.createElement("img");
    img.className = "item-image";
    img.src = imageUrl(item.image.src);
    img.alt = text(item.image.alt);
    img.loading = "lazy";
    card.append(img);

    const body = document.createElement("div");
    body.className = "item-body";

    const top = document.createElement("div");
    top.className = "item-topline";

    const name = document.createElement("h3");
    name.className = "item-name";
    name.textContent = text(item.name);

    const price = document.createElement("div");
    price.className = "item-price";
    price.textContent = money(item.price, menu.currency);

    top.append(name, price);
    body.append(top);

    const description = document.createElement("p");
    description.className = "item-description";
    description.textContent = text(item.description);
    body.append(description);

    const badges = document.createElement("div");
    badges.className = "badge-row";

    for (const tag of item.dietary) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = text(taxonomies.dietary[tag]?.label);
      badges.append(badge);
    }

    for (const allergen of item.allergens) {
      const badge = document.createElement("span");
      badge.className = "badge alert";
      badge.textContent = text(taxonomies.allergens[allergen]?.label);
      badges.append(badge);
    }

    for (const allergen of item.may_contain || []) {
      const badge = document.createElement("span");
      badge.className = "badge may";
      badge.textContent = `${text(labels.mayContain)} ${text(taxonomies.allergens[allergen]?.label)}`;
      badges.append(badge);
    }

    if (badges.children.length) body.append(badges);

    if (item.allergen_status !== "declared") {
      const unknown = document.createElement("p");
      unknown.className = "unknown-allergens";
      unknown.textContent = text(labels.unknownAllergens);
      body.append(unknown);
    }
    for (const alert of item.alerts || []) {
      const warning = document.createElement("p");
      warning.className = "food-alert";
      warning.textContent = text(alert);
      body.append(warning);
    }

    if (item.pairings.length) {
      const pairings = document.createElement("div");
      pairings.className = "pairings";
      const strong = document.createElement("strong");
      strong.textContent = `${text(labels.suggestedPairings)}: `;
      pairings.append(strong);

      item.pairings.forEach((pairing, index) => {
        if (index > 0) {
          pairings.append(document.createTextNode(", "));
        }

        if (pairing.itemId) {
          const link = document.createElement("a");
          link.className = "pairing-link";
          link.href = `#item-${pairing.itemId}`;
          link.textContent = text(pairing.label);
          link.addEventListener("click", (event) => {
            event.preventDefault();
            onPairingClick(pairing.itemId);
          });
          pairings.append(link);
          return;
        }

        pairings.append(document.createTextNode(text(pairing.label)));
      });
      body.append(pairings);
    }

    card.append(body);
    return card;
  }

  function renderApp(data) {
    const { menu, taxonomies, labels } = data;
    if (!requiredLanguages.includes(state.lang)) state.lang = menu.defaultLanguage || "it";

    document.documentElement.lang = state.lang;
    document.title = `${menu.venue.name} - ${text(labels.title)}`;

    const app = document.getElementById("app");
    app.textContent = "";

    const header = document.createElement("header");
    header.className = "menu-header";

    const titleBlock = document.createElement("div");
    const kicker = document.createElement("p");
    kicker.className = "venue-kicker";
    kicker.textContent = [menu.venue.city, text(labels.title)].filter(Boolean).join(" / ");
    const title = document.createElement("h1");
    title.className = "venue-name";
    title.textContent = menu.venue.name;
    const tagline = document.createElement("p");
    tagline.className = "venue-tagline";
    tagline.textContent = text(menu.venue.tagline);
    titleBlock.append(kicker, title, tagline);

    const languageField = document.createElement("div");
    languageField.className = "language-field";
    const label = document.createElement("label");
    label.htmlFor = "language";
    label.textContent = text(labels.language);
    const select = document.createElement("select");
    select.id = "language";
    for (const lang of menu.languages) {
      const option = document.createElement("option");
      option.value = lang;
      option.textContent = languageNames[lang] || lang;
      option.selected = lang === state.lang;
      select.append(option);
    }
    select.addEventListener("change", () => {
      state.lang = select.value;
      try { localStorage.setItem("mfm-lang", state.lang); } catch (_) { /* Private/file browsing. */ }
      renderApp(data);
    });
    languageField.append(label, select);
    header.append(titleBlock, languageField);
    app.append(header);

    const controls = document.createElement("section");
    controls.className = "controls";

    const searchBox = document.createElement("div");
    searchBox.className = "search-box control-group";
    const searchTitle = document.createElement("h2");
    searchTitle.className = "control-title";
    searchTitle.textContent = text(labels.search);

    const searchForm = document.createElement("form");
    searchForm.className = "search-form";
    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      state.search = state.searchDraft.trim();
      renderApp(data);
    });

    const search = document.createElement("input");
    search.type = "search";
    search.value = state.searchDraft;
    search.placeholder = text(labels.search);
    search.setAttribute("aria-label", text(labels.search));
    search.addEventListener("input", () => {
      state.searchDraft = search.value;
    });

    const searchButton = document.createElement("button");
    searchButton.type = "submit";
    searchButton.className = "search-submit";
    searchButton.setAttribute("aria-label", text(labels.search));
    searchButton.title = text(labels.search);
    const searchIcon = iconSvg("search");
    searchIcon.classList.add("search-icon");
    searchButton.append(searchIcon);

    searchForm.append(search, searchButton);
    searchBox.append(searchTitle, searchForm);

    controls.append(searchBox);
    controls.append(renderFilterGroup(text(labels.preferences), taxonomies.dietary, state.dietary, dietaryIcons, (id) => {
      state.dietary.has(id) ? state.dietary.delete(id) : state.dietary.add(id);
      renderApp(data);
    }));
    controls.append(renderFilterGroup(text(labels.allergies), taxonomies.allergens, state.allergens, allergenIcons, (id) => {
      state.allergens.has(id) ? state.allergens.delete(id) : state.allergens.add(id);
      renderApp(data);
    }));

    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "reset-button";
    reset.textContent = text(labels.reset);
    reset.addEventListener("click", () => {
      state.searchDraft = "";
      state.search = "";
      state.dietary.clear();
      state.allergens.clear();
      state.focusItemId = null;
      renderApp(data);
    });
    controls.append(reset);
    app.append(controls);

    const safetyNote = document.createElement("p");
    safetyNote.className = "safety-note";
    safetyNote.textContent = text(labels.safetyNote);
    app.append(safetyNote);

    const menuGrid = document.createElement("div");
    menuGrid.className = "menu-grid";
    let visibleCount = 0;

    for (const section of menu.sections) {
      const visibleItems = section.items.filter(itemMatches);
      if (!visibleItems.length) continue;
      visibleCount += visibleItems.length;

      const sectionEl = document.createElement("section");
      sectionEl.className = "section";

      const heading = document.createElement("div");
      heading.className = "section-heading";
      const sectionTitle = document.createElement("h2");
      sectionTitle.className = "section-title";
      sectionTitle.textContent = text(section.title);
      const sectionDescription = document.createElement("p");
      sectionDescription.className = "section-description";
      sectionDescription.textContent = text(section.description);
      heading.append(sectionTitle, sectionDescription);

      const items = document.createElement("div");
      items.className = "items";
      visibleItems.forEach((item) => {
        items.append(renderCard(item, menu, taxonomies, labels, (itemId) => navigateToItem(itemId, data)));
      });

      sectionEl.append(heading, items);
      menuGrid.append(sectionEl);
    }

    if (!visibleCount) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = text(labels.noResults);
      menuGrid.append(empty);
    }

    app.append(menuGrid);

    if (state.focusItemId) {
      const targetId = state.focusItemId;
      requestAnimationFrame(() => {
        const target = document.getElementById(`item-${targetId}`);
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.focus({ preventScroll: true });
        if (window.history?.replaceState) {
          window.history.replaceState(null, "", `#item-${targetId}`);
        }
        state.focusItemId = null;
      });
    }
  }

  loadData()
    .then(renderApp)
    .catch((error) => {
      const app = document.getElementById("app");
      app.textContent = "⚠️ Impossibile caricare il menù.";
    });
})();
</script></body></html>
