:root {
  --paper:#E6E1DC; --white:#FFFFFF;
  --ink:#1A1A1A; --muted:#3C322D;
  --line:#D0CACA; --red:#5A3228;
  --mint:#F0EBE6; --rose:#D8C8BB;
  --focus:#000000;
  --action:#5A3228; --action-text:#FFFFFF;
}
body { overflow-wrap:anywhere }
.topline { background:var(--action);color:var(--action-text) }
.mast-title { display:block }
.mast-title h1 { max-width:100%;font-size:88px;line-height:1.06 }
.mast-title h1.long-name { font-size:54px }
.mast-title h1.very-long-name { font-size:38px }
.utilities { margin-left:auto }
.primary,.filter-trigger[aria-expanded=true],.add-button.selected,.compare-dock,.toast {
  background:var(--action);color:var(--action-text);border-color:var(--action)
}
.primary:hover:not(:disabled) { background:var(--action);color:var(--action-text);filter:brightness(.9) }
.add-button.selected:hover:not(:disabled),.filter-trigger[aria-expanded=true]:hover:not(:disabled),
.compare-dock .compare-clear:hover:not(:disabled) { color:var(--action-text) }
.tag,.tag.alcohol-free { background:#D8C8BB;color:#3C322D }
.search input { background:var(--white) }
.counter { color:var(--ink) }
.item-heading { flex-wrap:wrap }
.item-heading h3 { flex:1 1 145px }
.item-heading .price { max-width:100%;white-space:normal;text-align:right;overflow-wrap:anywhere }
.price { line-height:1.4 }
.photo { background:#EFEFEF }
.photo img { object-fit:contain;aspect-ratio:1.65 }
.detail-photo { object-fit:contain;background:var(--white) }
.item-tools .add-button { margin-left:auto;flex-shrink:0 }
.ingredients,.variant-note,.row-top>div,.row-price,.variant-option span { min-width:0;overflow-wrap:anywhere }
.row-bottom { gap:12px }
.side { top:var(--navigation-offset,145px) }
.section { scroll-margin-top:0 }
.stepper { flex-shrink:0 }
.topline .wrap { justify-content:center }
.menu-intro { min-height:24px }
.diet-notes,.allergen-reason { color:var(--muted);font-size:12px;line-height:1.6 }
.allergen-list { padding-left:18px }
.allergen-list li { margin:8px 0 }
.allergen-reason { margin:3px 0 }
.detail-warning { border-top:1px solid var(--line);padding-top:16px }
.variant-option input { flex-shrink:0 }
.variant-option span:last-child { text-align:right }
.comparison-table .price { white-space:normal }
.comparison-table th[scope=row] { width:105px }
.comparison-table { min-width:630px }
.nav-inner:has(.categories[hidden]) .search { flex:1;max-width:550px;margin-left:auto }
.navigation:not(:has(.nav-inner:not([hidden]),.workbench:not([hidden]))) { display:none }
.ssr-variants { padding-left:18px }
.no-results { color:var(--muted) }
.footer-notes:empty { display:none }
@media(max-width:850px) {
  .mast-title h1 { font-size:68px }
  .mast-title h1.long-name { font-size:46px }
  .mast-title h1.very-long-name { font-size:34px }
  .mobile-bar { gap:10px }
  .mobile-bar .primary { min-width:0;max-width:none }

function queryParts() {

  const match = value.match(/(?:sotto|entro|under|below|less than|up to|meno di|moins de|sous|jusqu'a|unter|bis|menos de|hasta)\s*(?:([€$£])\s*)?(\d+(?:[.,]\d{1,2})?)(?![\d.,])(?:\s*(euro?s?|eur|usd|gbp|€|\$|£))?(?=\s|$)/);

}
function renderFilters() {
  $('diet-field').hidden = !availableDiets.length;
  $('format-field').hidden = !availableFormats.length;
  $('budget-field').hidden = !features.budget;
  $('filter-trigger').hidden = !filtersAvailable;
  $('sort-control').hidden = !features.budget;
  $('diet-filters').innerHTML = availableDiets.map(key => `<label><input type="checkbox" data-diet="${key}" ${state.diets.has(key) ? 'checked' : ''}>${esc(t(key))}</label>`).join('');
  $('format-filters').innerHTML = availableFormats.map(key => `<label><input type="checkbox" data-format="${key}" ${state.formats.has(key) ? 'checked' : ''}>${esc(t(key))}</label>`).join('');
  $('budget').max = priceLimit;
  $('budget').value = state.budget ?? priceLimit;
  $('budget-output').textContent = state.budget === null ? t('anyPrice') : money(state.budget);
}
let sectionObserver;
function observeSections() {
  sectionObserver?.disconnect();
  sectionObserver = new IntersectionObserver(entries => {
    const entry = entries.find(value => value.isIntersecting);
    if (!entry) return;
    $('categories').querySelectorAll('a').forEach(anchor => {
      const active = anchor.hash === '#' + entry.target.id;
      anchor.classList.toggle('active',active);
      if (active) anchor.setAttribute('aria-current','location');
      else anchor.removeAttribute('aria-current');
    });
  }, {rootMargin:'-140px 0px -55% 0px',threshold:0});
  document.querySelectorAll('.section').forEach(section => sectionObserver.observe(section));
}
let previousFocus = null;
function openDialog(id) {
  const open = document.querySelector('dialog[open]');
  if (open?.id === id) return;
  if (!open) previousFocus = document.activeElement;
  else open.close();
  $(id).showModal();
  $(id).scrollTop = 0;
}
for (const dialog of document.querySelectorAll('dialog')) {
  dialog.addEventListener('click',event => {
    if (event.target !== dialog) return;
    const rect = dialog.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
  });
  dialog.addEventListener('close',() => {
    if (document.querySelector('dialog[open]')) return;
    if (previousFocus?.isConnected) previousFocus.focus();
    else document.querySelector('[data-open-selection]').focus();
  });
}
function allergenHTML(item) {
  const value = item.allergens;
  if (!value.declared.length && !value.inferred.length && !value.notes.length) return '';
  return `<section class="allergens" aria-label="${esc(t('allergens'))}">
    ${value.declared.length ? `<h3>${esc(t('declaredAllergens'))}</h3><p>${value.declared.map(id => esc(allergenName(id))).join(', ')}</p>` : ''}
    ${value.inferred.length ? `<h3>${esc(t('inferredAllergens'))}</h3><ul class="allergen-list">${value.inferred.map(finding => `<li><strong>${esc(allergenName(finding.id))}</strong><p class="allergen-reason">${esc(finding.reason)}</p></li>`).join('')}</ul>` : ''}
    ${value.notes.map(note => `<p class="diet-notes">${esc(note)}</p>`).join('')}
  </section>`;
}
function openDetail(id) {
  const item = itemById(id);
  if (!item) return;
  state.detail = id;
  state.variant = (eligibleVariants(item)[0] || item.variants[0]).id;
  renderDetail();
  openDialog('detail-dialog');
  $('detail-dialog').scrollTop = 0;
  $('detail-dialog').querySelector('.modal-close').focus();
}
function renderDetail() {
  const item = itemById(state.detail);
  const variant = item.variants.find(v => v.id === state.variant);
  const peers = items().filter(other => other.id !== item.id && other.sectionId === item.sectionId && matching(other))
    .map(other => ({item:other,shared:other.ingredient_ids.filter(id => item.ingredient_ids.includes(id))}))
    .filter(peer => peer.shared.length >= 2).sort((a,b) => b.shared.length - a.shared.length).slice(0,2);
  const category = menu().sections.find(section => section.id === item.sectionId);
  $('detail-root').innerHTML = `
    ${item.image.url ? `<img class="detail-photo" src="${esc(item.image.url)}" alt="${esc(item.image.alt)}">` : ''}
    <div class="detail-content">
      ${category.name ? `<p class="eyebrow">${esc(category.name)}</p>` : ''}
      <h2 id="detail-title">${esc(item.name)}</h2>
      ${item.name !== item.original_name ? `<p class="ingredients">${esc(item.original_name)}</p>` : ''}
      <div class="detail-price">${esc(priceText(variant))}</div>
      ${item.description ? `<p>${esc(item.description)}</p>` : ''}
      ${item.ingredients.length ? `<h3>${esc(t('ingredients'))}</h3><p class="ingredients">${esc(ingredientText(item))}</p>` : ''}
      ${tags(item) ? `<div class="tags">${tags(item)}</div>` : ''}
      ${item.variants.length > 1 ? `<fieldset class="variant-options"><legend>${esc(t('chooseFormat'))}</legend>${item.variants.map(v => `<label class="variant-option"><input type="radio" name="variant" value="${esc(v.id)}" ${v.id === state.variant ? 'checked' : ''}><span>${esc(variantLabel(item,v))}</span><span>${esc(priceText(v))}</span></label>`).join('')}</fieldset>` : variantLabel(item,variant) ? `<p class="variant-note">${esc(variantLabel(item,variant))}</p>` : ''}
      ${allergenHTML(item)}
      ${item.notes.length ? `<h3>${esc(t('notes'))}</h3>${item.notes.map(note => `<p>${esc(note)}</p>`).join('')}` : ''}
      <div class="detail-actions"><button class="primary" id="detail-add">${esc(t('add'))}</button></div>
      ${peers.length ? `<div class="suggestions"><h3>${esc(t('comparable'))}</h3>${peers.map(peer => `<button data-detail="${esc(peer.item.id)}"><strong>${esc(peer.item.name)} &nearr;</strong><small>${esc(t('shared')+': '+peer.shared.map(id => menu().ingredient_names[id]).join(', '))}</small></button>`).join('')}</div>` : ''}
      <p class="detail-warning">${esc(t('allergyNote'))}</p>
    </div>`;
}
function updateAddButtons() {
  document.querySelectorAll('[data-add]').forEach(button => {
    const qty = chosen(button.dataset.add);
    button.classList.toggle('selected',qty > 0);
    button.textContent = qty || '+';
  });
}
function addItem(id, variantId) {
  const item = itemById(id);
  if (!item) return;
  if (!variantId && item.variants.length > 1) { openDetail(id); return; }
  const variant = item.variants.find(v => v.id === (variantId || item.variants[0].id));
  if (!variant) return;
  const key = rowKey(id,variant.id), existing = state.selection.get(key);
  if (existing?.qty >= 20) { notify(t('quantityLimit')); return; }
  state.selection.set(key,{id,variant:variant.id,qty:(existing?.qty || 0)+1});
  persist();
  renderSelection();
  updateAddButtons();
  notify(t('added'));
}
function selectedHTML() {
  if (!state.selection.size) return `<p class="side-empty">${esc(t('selectionEmpty'))}</p>`;
  return [...state.selection].map(([key,row]) => {
    const item = itemById(row.id), variant = item.variants.find(v => v.id === row.variant);
    return `<div class="selected-row"><div class="row-top"><div><h3>${esc(item.name)}</h3>${variantLabel(item,variant) ? `<p class="variant-note">${esc(variantLabel(item,variant))}</p>` : ''}</div><button class="remove" data-remove-row="${esc(key)}" aria-label="${esc(t('remove')+': '+item.name)}" title="${esc(t('remove'))}">&times;</button></div>
      <div class="row-bottom"><div class="stepper"><button data-qty="${esc(key)}" data-delta="-1" aria-label="${esc(t('decrease')+': '+item.name)}" title="${esc(t('decrease'))}">&minus;</button><output>${row.qty}</output><button data-qty="${esc(key)}" data-delta="1" aria-label="${esc(t('increase')+': '+item.name)}" title="${esc(t('increase'))}" ${row.qty >= 20 ? 'disabled' : ''}>+</button></div><span class="row-price">${esc(fixedPrice(variant) ? money(variant.price_cents*row.qty) : priceText(variant))}</span></div></div>`;
  }).join('');
}
function summaryHTML() {
  if (!state.selection.size) return '';
  const amount = total();
  return `<div class="total-row">${amount === null ? `<span>${esc(t('unavailableTotal'))}</span>` : `<span>${esc(t('total'))}</span><strong>${esc(money(amount))}</strong>`}</div>
    <button class="primary full" data-show-staff>${esc(t('staff'))}</button>
    ${amount !== null ? `<p class="selection-notes">${esc(t('totalNote'))}</p>` : ''}`;
}
function renderSelection() {
  const html = selectedHTML(), summary = summaryHTML(), amount = total();
  $('side-items').innerHTML = html;
  $('selection-items').innerHTML = html;
  $('side-summary').innerHTML = summary;
  $('selection-summary').innerHTML = summary;
  document.querySelectorAll('.selection-count').forEach(element => element.textContent = count());
  document.querySelectorAll('.selection-total').forEach(element => {
    element.textContent = amount !== null ? money(amount) : state.selection.size ? t('unavailableTotal') : '';
  });
}
function renderStaff() {
  $('staff-root').innerHTML = [...state.selection.values()].map(row => {
    const item = itemById(row.id), variant = item.variants.find(v => v.id === row.variant);
    return `<div class="staff-item"><span class="staff-qty">${row.qty}&times;</span><div><h3>${esc(item.original_name)}</h3>${variantLabel(item,variant,true) ? `<p>${esc(variantLabel(item,variant,true))}</p>` : ''}${item.name !== item.original_name ? `<p>${esc(item.name)}</p>` : ''}</div></div>`;
  }).join('');
}
function renderCompareDock() {
  $('compare-dock').hidden = !state.compared.size;
  $('compare-summary').textContent = state.compared.size+' / 3';
  $('compare-open').disabled = state.compared.size < 2;
  document.querySelectorAll('[data-compare]').forEach(input => input.checked = state.compared.has(input.dataset.compare));
}
function renderComparison() {
  const compared = [...state.compared].map(itemById), rows = [];
  if (compared.some(item => item.variants.some(v => v.price_cents !== null || v.price_text))) {
    rows.push({label:t('price'),values:compared.map(item => item.variants.map(v => `${variantLabel(item,v) ? esc(variantLabel(item,v))+': ' : ''}<span class="price">${esc(priceText(v))}</span>`).join('<br>'))});
  }
  if (compared.some(item => item.ingredients.length)) {
    rows.push({label:t('ingredients'),values:compared.map(item => esc(ingredientText(item) || t('notDeclared')))});
  }
  if (compared.some(item => tags(item))) {
    rows.push({label:t('attributes'),values:compared.map(item => tags(item) || esc(t('notDeclared')))});
  }
  if (compared.some(item => allergenHTML(item))) {
    rows.push({label:t('allergens'),values:compared.map(item => allergenHTML(item) || esc(t('notDeclared')))});
  }
  $('comparison-root').innerHTML = `<table class="comparison-table"><thead><tr><th></th>${compared.map(item => `<th scope="col">${esc(item.name)}<button class="compare-remove" data-remove-compare="${esc(item.id)}">${esc(t('remove'))}</button></th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr><th scope="row">${esc(row.label)}</th>${row.values.map(value => `<td class="${new Set(row.values).size > 1 ? 'different' : ''}">${value}</td>`).join('')}</tr>`).join('')}<tr><th></th>${compared.map(item => `<td><button class="secondary" data-compare-add="${esc(item.id)}">${esc(t('add'))}</button></td>`).join('')}</tr></tbody></table>
    ${compared.some(item => allergenHTML(item)) ? `<p class="detail-warning">${esc(t('allergyNote'))}</p>` : ''}`;
}
function translate() {
  document.documentElement.lang = state.lang;
  const title = menu().venue.name || PAGE_TITLE;
  document.title = title+' · '+t('menuTitle');
  $('venue-name').textContent = title;
  $('venue-name').classList.toggle('long-name',title.length > 18 && title.length <= 36);
  $('venue-name').classList.toggle('very-long-name',title.length > 36);
  $('venue-subtitle').textContent = menu().venue.subtitle || '';
  $('venue-subtitle').hidden = !menu().venue.subtitle;
  $('footer-name').textContent = menu().venue.name || '';
  $('footer-notes').innerHTML = menu().notes.map(note => `<p>${esc(note)}</p>`).join('');
  document.querySelectorAll('[data-t]').forEach(element => element.textContent = t(element.dataset.t));
  $('language').value = state.lang;
  $('language').setAttribute('aria-label',({it:'Lingua',en:'Language',fr:'Langue',de:'Sprache',es:'Idioma'})[state.lang] || 'Language');
  for (const option of $('language').options) {
    try { option.textContent = new Intl.DisplayNames([option.value],{type:'language'}).of(option.value); }
    catch { option.textContent = option.value; }
  }
  $('search').placeholder = t('search');
  $('search-clear').setAttribute('aria-label',t('clearSearch'));
  $('search-clear').title = t('clearSearch');
  $('sort').setAttribute('aria-label',t('sort'));
  document.querySelectorAll('[data-open-selection]').forEach(button => button.setAttribute('aria-label',t('mySelection')));
  $('budget').setAttribute('aria-label',t('maxPrice'));
  $('compare-clear').setAttribute('aria-label',t('clearComparison'));
  $('compare-clear').title = t('clearComparison');
  document.querySelectorAll('[data-close]').forEach(button => {button.setAttribute('aria-label',t('close'));button.title = t('close');});
  document.querySelectorAll('[data-scroll-compare]').forEach(button => {
    const label = t(button.dataset.scrollCompare === '1' ? 'next' : 'previous');
    button.setAttribute('aria-label',label);button.title = label;
  });
  $('categories').innerHTML = menu().sections.filter(section => section.name)
    .map(section => `<a href="#section-${esc(section.id)}" data-category="${esc(section.id)}">${esc(section.name)}</a>`).join('');
  $('categories').hidden = !features.categories;
  $('categories').setAttribute('aria-label',t('menuTitle'));
  $('search-box').hidden = !features.search;
  $('nav-inner').hidden = !features.categories && !features.search;
  renderFilters();renderMenu();renderSelection();renderCompareDock();
  if ($('detail-dialog').open) renderDetail();
  if ($('compare-dialog').open) renderComparison();
  if ($('staff-dialog').open) renderStaff();
}
function reset() {
  state.query = '';state.diets.clear();state.formats.clear();state.budget = null;
  $('search').value = '';
  renderFilters();renderMenu();
}
function removeQueryPart(type,key) {
  const parsed = queryParts();
  if (type === 'query-budget') parsed.budget = null;
  if (type === 'query-diet') parsed.diets.delete(key);
  if (type === 'query-text') parsed.words = [];
  state.query = [...parsed.words,...[...parsed.diets].map(key => text[key].en),
    ...(parsed.budget !== null ? [(parsed.exclusive ? 'under ' : 'up to ')+(parsed.budget/100)] : [])].join(' ');
  $('search').value = state.query;
}
$('search').addEventListener('input',event => {state.query = event.target.value;renderMenu();});
$('search-clear').addEventListener('click',() => {state.query = '';$('search').value = '';renderMenu();$('search').focus();});
$('language').addEventListener('change',event => {state.lang = event.target.value;persist();translate();});
$('sort').addEventListener('change',event => {state.sort = event.target.value;renderMenu();});
$('budget').addEventListener('input',event => {
  const amount = Number(event.target.value);
  state.budget = amount === priceLimit ? null : amount;
  $('budget-output').textContent = state.budget === null ? t('anyPrice') : money(state.budget);
  renderMenu();
});
$('filter-trigger').addEventListener('click',() => {
  const open = $('filter-panel').hidden;
  $('filter-panel').hidden = !open;
  $('filter-trigger').setAttribute('aria-expanded',String(open));
  $('filter-trigger').lastElementChild.textContent = open ? '−' : '+';
});
$('reset-filters').addEventListener('click',reset);
$('empty-reset').addEventListener('click',() => {reset();if (features.search) $('search').focus();});
$('compare-clear').addEventListener('click',() => {state.compared.clear();renderCompareDock();});
$('compare-open').addEventListener('click',() => {
  if (state.compared.size < 2) return;
  renderComparison();openDialog('compare-dialog');
});
document.addEventListener('change',event => {
  const target = event.target;
  if (target.dataset.diet) {
    target.checked ? state.diets.add(target.dataset.diet) : state.diets.delete(target.dataset.diet);
    renderMenu();
  }
  if (target.dataset.format) {
    target.checked ? state.formats.add(target.dataset.format) : state.formats.delete(target.dataset.format);
    renderMenu();
  }
  if (target.dataset.compare) {
    if (target.checked && state.compared.size >= 3) {target.checked = false;notify(t('maxCompare'));return;}
    target.checked ? state.compared.add(target.dataset.compare) : state.compared.delete(target.dataset.compare);
    renderCompareDock();
  }
  if (target.name === 'variant') {
    state.variant = target.value;
    const variant = itemById(state.detail).variants.find(v => v.id === state.variant);
    $('detail-dialog').querySelector('.detail-price').textContent = priceText(variant);
  }
});
document.addEventListener('click',event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  if (button.dataset.close) {$(button.dataset.close).close();return;}
  if (button.dataset.scrollCompare) {$('comparison-root').scrollBy({left:Number(button.dataset.scrollCompare)*220});return;}
  if (button.hasAttribute('data-open-selection')) {renderSelection();openDialog('selection-dialog');return;}
  if (button.dataset.detail) {openDetail(button.dataset.detail);return;}
  if (button.dataset.add) {addItem(button.dataset.add);return;}
  if (button.id === 'detail-add') {addItem(state.detail,state.variant);return;}
  if (button.dataset.compareAdd) {
    const id = button.dataset.compareAdd;
    if (itemById(id).variants.length > 1) openDetail(id);
    else addItem(id);
    return;
  }
  if (button.dataset.removeCompare) {
    state.compared.delete(button.dataset.removeCompare);renderCompareDock();
    if (state.compared.size < 2) $('compare-dialog').close();
    else renderComparison();
    return;
  }
  if (button.dataset.removeFilter) {
    const type = button.dataset.removeFilter;
    if (type === 'diet') state.diets.delete(button.dataset.key);
    if (type === 'format') state.formats.delete(button.dataset.key);
    if (type === 'budget') state.budget = null;
    if (type.startsWith('query-')) removeQueryPart(type,button.dataset.key);
    renderFilters();renderMenu();return;
  }
  if (button.dataset.qty || button.dataset.removeRow) {
    const key = button.dataset.qty || button.dataset.removeRow;
    const container = button.closest('#selection-dialog') ? 'selection-items' : 'side-items';
    const row = state.selection.get(key);
    if (button.dataset.removeRow) state.selection.delete(key);
    else if (row) {
      row.qty = Math.min(20,row.qty + Number(button.dataset.delta));
      if (row.qty <= 0) state.selection.delete(key);
    }
    persist();renderSelection();updateAddButtons();
    const equivalent = [...$(container).querySelectorAll('[data-qty]')]
      .find(el => el.dataset.qty === key && el.dataset.delta === button.dataset.delta);
    if (equivalent && !equivalent.disabled) equivalent.focus();
    else if ($('selection-dialog').open) $('selection-dialog').querySelector('.modal-close').focus();
    return;
  }
  if (button.hasAttribute('data-show-staff')) {renderStaff();openDialog('staff-dialog');}
});
// An unavailable optional image must not leave a broken image or empty frame.
document.addEventListener('error',event => {
  if (!(event.target instanceof HTMLImageElement)) return;
  const article = event.target.closest('.item');
  if (article) article.classList.remove('featured');
  (event.target.closest('.photo') || event.target).remove();
},true);
translate();
const navigation = document.querySelector('.navigation');
new ResizeObserver(() => {
  const offset = navigation.getBoundingClientRect().height + 20;
  document.documentElement.style.scrollPaddingTop = offset+'px';
  document.documentElement.style.setProperty('--navigation-offset',offset+'px');
}).observe(navigation);
})();
</script>
</body>
</html>
